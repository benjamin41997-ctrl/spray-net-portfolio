name = "spray-net-visualizer-api"
main = "worker.mjs"
compatibility_date = "2026-05-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
VISUALIZER_ALLOWED_ORIGINS = "https://benjamin41997-ctrl.github.io"
VISUALIZER_MAX_TEN_MINUTE_RENDERS = "5"
VISUALIZER_MAX_HOURLY_RENDERS = "30"
VISUALIZER_MIN_INTERVAL_SECONDS = "5"
VISUALIZER_TIMEOUT_SECONDS = "240"
VISUALIZER_FAST_TEST_MODE = "true"
VISUALIZER_PREVIEW_MODEL = "gpt-image-2.5-flare"
VISUALIZER_DETAIL_MODEL = "gpt-image-2.5-sunburst"

[[durable_objects.bindings]]
name = "VISUALIZER_GATE"
class_name = "VisualizerGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VisualizerGate"]

[observability]
enabled = false


[[r2_buckets]]
binding = "CONSULTATION_MEDIA"
bucket_name = "spray-net-portfolio-consultations"
